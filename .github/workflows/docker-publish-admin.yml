name: Publish VPN Admin Panel to Docker Hub

on:
  push:
    branches: [ "main", "master" ]
    paths:
      - 'vpn-admin-panel/**'
      - '.github/workflows/docker-publish-admin.yml'
  workflow_dispatch:

env:
  DOCKERHUB_USERNAME: "taksa1990"
  
jobs:
  push_backend:
    name: Build & Push Backend
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Backend image
        uses: docker/build-push-action@v6
        with:
          context: ./vpn-admin-panel/backend
          file: ./vpn-admin-panel/backend/Dockerfile
          push: true
          tags: ${{ env.DOCKERHUB_USERNAME }}/vpn-admin-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  push_frontend:
    name: Build & Push Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./vpn-admin-panel/frontend
          file: ./vpn-admin-panel/frontend/Dockerfile
          push: true
          tags: ${{ env.DOCKERHUB_USERNAME }}/vpn-admin-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
