name: Android build

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android/**"
  workflow_dispatch:
  release:
    types: [created]

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Decode release keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        if: env.RELEASE_KEYSTORE_BASE64 != ''
        run: |
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > release.keystore
          cat > ../keystore.properties <<EOF
          storeFile=$(pwd)/release.keystore
          storePassword=$RELEASE_KEYSTORE_PASSWORD
          keyAlias=$RELEASE_KEY_ALIAS
          keyPassword=$RELEASE_KEY_PASSWORD
          EOF

      - name: Build debug APK
        if: github.event_name != 'release'
        env:
          BOOTSTRAP_VLESS_CONFIGS: ${{ secrets.BOOTSTRAP_VLESS_CONFIGS }}
          BOOTSTRAP_KEY: ${{ secrets.BOOTSTRAP_KEY }}
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Build release APK
        if: github.event_name == 'release'
        env:
          BOOTSTRAP_VLESS_CONFIGS: ${{ secrets.BOOTSTRAP_VLESS_CONFIGS }}
          BOOTSTRAP_KEY: ${{ secrets.BOOTSTRAP_KEY }}
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Upload debug artifacts
        if: github.event_name != 'release'
        uses: actions/upload-artifact@v4
        with:
          name: khate-debug-apks
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

      - name: Upload release artifacts
        if: github.event_name == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: khate-release-apks
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Attach release APKs to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/release/*.apk
