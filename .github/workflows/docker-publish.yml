name: Publish Docker Images

on:
  push:
    branches: [ "main" ]
    paths:
      - 'vpn-admin-panel/**'
      - '.github/workflows/docker-publish.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'vpn-admin-panel/**'

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build and push Backend
      uses: docker/build-push-action@v5
      with:
        context: ./vpn-admin-panel/backend
        push: ${{ github.event_name != 'pull_request' }}
        tags: taksa1990/vpn-admin-backend:latest
        cache-from: type=registry,ref=taksa1990/vpn-admin-backend:buildcache
        cache-to: type=registry,ref=taksa1990/vpn-admin-backend:buildcache,mode=max

    - name: Build and push Frontend
      uses: docker/build-push-action@v5
      with:
        context: ./vpn-admin-panel/frontend
        push: ${{ github.event_name != 'pull_request' }}
        tags: taksa1990/vpn-admin-frontend:latest
        cache-from: type=registry,ref=taksa1990/vpn-admin-frontend:buildcache
        cache-to: type=registry,ref=taksa1990/vpn-admin-frontend:buildcache,mode=max
