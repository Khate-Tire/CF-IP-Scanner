name: Deploy Cloudflare Worker

on:
  push:
    branches: [main]
    paths:
      - "worker/**"
      - ".github/workflows/worker-deploy.yml"
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy worker
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install worker dependencies
        run: |
          npm install --no-audit --no-fund
          npm install --no-save --no-audit --no-fund wrangler@4.68.1

      - name: Inject Hyperdrive ID into wrangler.toml
        env:
          HYPERDRIVE_ID: ${{ secrets.HYPERDRIVE_ID }}
        run: |
          if [ -z "$HYPERDRIVE_ID" ]; then
            echo "ERROR: HYPERDRIVE_ID secret is not set"
            exit 1
          fi
          sed -i "s/YOUR_HYPERDRIVE_ID/${HYPERDRIVE_ID}/g" wrangler.toml
          echo "wrangler.toml after substitution:"
          grep -E '^id\s*=' wrangler.toml || true

      - name: Deploy with Wrangler
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        # Run wrangler directly so its stderr is visible in the job log;
        # cloudflare/wrangler-action@v3 hides the real failure reason.
        run: npx --no-install wrangler@4.68.1 deploy 2>&1
