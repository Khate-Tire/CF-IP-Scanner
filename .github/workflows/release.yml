name: Build Desktop Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Read version from package.json
        id: read
        run: |
          v=$(node -p "require('./package.json').version")
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "App version: $v"

      - name: Sync CITATION.cff version + date
        run: |
          v="${{ steps.read.outputs.version }}"
          today=$(date -u +%Y-%m-%d)
          # Replace 'version: <anything>' and 'date-released: "<anything>"' in-place
          sed -i -E "s/^version: .*/version: ${v}/" CITATION.cff
          sed -i -E "s/^date-released: .*/date-released: \"${today}\"/" CITATION.cff
          echo "--- CITATION.cff after sync ---"
          grep -E '^(version|date-released):' CITATION.cff

      - name: Commit CITATION.cff if changed
        run: |
          if ! git diff --quiet -- CITATION.cff; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add CITATION.cff
            git commit -m "chore(citation): sync version to ${{ steps.read.outputs.version }} [skip ci]"
            git push
          else
            echo "CITATION.cff already up to date"
          fi

  deploy-worker:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Worker Dependencies
        working-directory: ./worker
        run: npm install

      - name: Inject Hyperdrive ID
        working-directory: ./worker
        run: sed -i 's/YOUR_HYPERDRIVE_ID/${{ secrets.HYPERDRIVE_ID }}/' wrangler.toml

      - name: Deploy Cloudflare Worker
        working-directory: ./worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}

  build-windows:
    runs-on: windows-latest

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pyinstaller

      - name: Create .env files from secrets
        run: |
          @"
          DB_HOST=${{ secrets.DB_HOST }}
          DB_USER=${{ secrets.DB_USER }}
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}
          DB_NAME=${{ secrets.DB_NAME }}
          DB_PORT=${{ secrets.DB_PORT }}
          ADMIN_API_URL=${{ secrets.ADMIN_API_URL }}
          WORKER_URL=${{ secrets.WORKER_URL }}
          WORKER_API_KEY=${{ secrets.WORKER_API_KEY }}
          AGDB_SECRET_KEY=${{ secrets.AGDB_SECRET_KEY }}
          VITE_FALLBACK_CONFIG=${{ secrets.VITE_FALLBACK_CONFIG }}
          VITE_AUTO_SUB_URL=${{ secrets.VITE_AUTO_SUB_URL }}
          "@ | Out-File -FilePath backend/.env -Encoding utf8
          @"
          VITE_FALLBACK_CONFIG=${{ secrets.VITE_FALLBACK_CONFIG }}
          VITE_AUTO_SUB_URL=${{ secrets.VITE_AUTO_SUB_URL }}
          VITE_ADMIN_PANEL_URL=${{ secrets.ADMIN_API_URL }}
          "@ | Out-File -FilePath frontend/.env -Encoding utf8
        shell: pwsh
          
      - name: Build Python Backend (.exe)
        run: |
          python build_backend.py

      - name: Download Xray Core
        run: |
          Invoke-WebRequest -Uri "https://github.com/XTLS/Xray-core/releases/download/v26.2.6/Xray-windows-64.zip" -OutFile xray.zip
          Expand-Archive -Path xray.zip -DestinationPath xray_core -Force
          Remove-Item xray.zip
          dir xray_core
        shell: pwsh
          
      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm install --legacy-peer-deps
        
      - name: Build React Frontend
        working-directory: ./frontend
        run: npm run build
        
      - name: Install Root Electron Dependencies
        run: npm install

      - name: Build Electron App
        run: npm run dist -- --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: dist/*.exe

  build-macos:
    runs-on: macos-latest

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pyinstaller

      - name: Create .env files from secrets
        run: |
          cat > backend/.env << EOF
          DB_HOST=${{ secrets.DB_HOST }}
          DB_USER=${{ secrets.DB_USER }}
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}
          DB_NAME=${{ secrets.DB_NAME }}
          DB_PORT=${{ secrets.DB_PORT }}
          ADMIN_API_URL=${{ secrets.ADMIN_API_URL }}
          WORKER_URL=${{ secrets.WORKER_URL }}
          WORKER_API_KEY=${{ secrets.WORKER_API_KEY }}
          AGDB_SECRET_KEY=${{ secrets.AGDB_SECRET_KEY }}
          VITE_FALLBACK_CONFIG=${{ secrets.VITE_FALLBACK_CONFIG }}
          VITE_AUTO_SUB_URL=${{ secrets.VITE_AUTO_SUB_URL }}
          EOF
          cat > frontend/.env << EOF
          VITE_FALLBACK_CONFIG=${{ secrets.VITE_FALLBACK_CONFIG }}
          VITE_AUTO_SUB_URL=${{ secrets.VITE_AUTO_SUB_URL }}
          VITE_ADMIN_PANEL_URL=${{ secrets.ADMIN_API_URL }}
          EOF

      - name: Build Python Backend (macOS binary)
        run: |
          python build_backend.py

      - name: Download Xray Core (macOS)
        run: |
          curl -L -o xray.zip "https://github.com/XTLS/Xray-core/releases/download/v26.2.6/Xray-macos-64.zip"
          mkdir -p xray_core
          unzip xray.zip -d xray_core
          chmod +x xray_core/xray
          rm xray.zip
          ls -la xray_core

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm install --legacy-peer-deps

      - name: Build React Frontend
        working-directory: ./frontend
        run: npm run build

      - name: Install Root Electron Dependencies
        run: npm install

      - name: Build Electron App (DMG)
        run: npx electron-builder --mac --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-build
          path: |
            dist/*.dmg
            dist/*.zip

  release:
    needs: [version, build-windows, build-macos]
    runs-on: ubuntu-latest

    steps:
      - name: Download Windows Build
        uses: actions/download-artifact@v4
        with:
          name: windows-build
          path: artifacts/windows

      - name: Download macOS Build
        uses: actions/download-artifact@v4
        with:
          name: macos-build
          path: artifacts/macos

      - name: Remove stale assets from previous run (if any)
        # Avoids "422 already_exists" when re-running the workflow for the
        # same tag — gh exits 0 when the release or asset is missing.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="v${{ needs.version.outputs.version }}"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $tag exists — clearing matching assets..."
            for f in artifacts/windows/*.exe artifacts/macos/*.dmg artifacts/macos/*.zip; do
              [ -e "$f" ] || continue
              name="$(basename "$f")"
              gh release delete-asset "$tag" "$name" --repo "$GITHUB_REPOSITORY" --yes 2>/dev/null || true
            done
          else
            echo "Release $tag does not exist yet — nothing to clean."
          fi

      - name: Upload All Artifacts to Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/windows/*.exe
            artifacts/macos/*.dmg
            artifacts/macos/*.zip
          tag_name: "v${{ needs.version.outputs.version }}"
          name: "v${{ needs.version.outputs.version }}"
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
